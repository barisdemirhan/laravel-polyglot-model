name: Run Tests

on:
    push:
        branches: [main, develop]
    pull_request:
        branches: [main, develop]

permissions:
  contents: read

jobs:
    test:
        runs-on: ubuntu-latest

        strategy:
            fail-fast: true
            matrix:
                include:
                    - php: 8.1
                      laravel: 10.*
                      testbench: 8.*
                      phpunit: 10.*
                      composer-flags: --no-security-blocking
                    - php: 8.2
                      laravel: 11.*
                      testbench: 9.*
                      phpunit: 10.*
                      composer-flags: ''
                    - php: 8.3
                      laravel: 12.*
                      testbench: 10.*
                      phpunit: 11.*
                      composer-flags: ''
                    - php: 8.4
                      laravel: 12.*
                      testbench: 10.*
                      phpunit: 11.*
                      composer-flags: ''
                    - php: 8.4
                      laravel: 13.*
                      testbench: 11.*
                      phpunit: 12.*
                      composer-flags: ''
                    - php: 8.5
                      laravel: 13.*
                      testbench: 11.*
                      phpunit: 12.*
                      composer-flags: ''

        name: PHP ${{ matrix.php }} - Laravel ${{ matrix.laravel }}

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: ${{ matrix.php }}
                  extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite
                  tools: composer:2.9.8
                  coverage: none

            - name: Install dependencies
              run: |
                  composer require "laravel/framework:${{ matrix.laravel }}" "orchestra/testbench:${{ matrix.testbench }}" "phpunit/phpunit:${{ matrix.phpunit }}" --no-interaction --no-update
                  composer update --prefer-dist --no-interaction ${{ matrix.composer-flags }}

            - name: Execute tests
              run: vendor/bin/phpunit

    code-style:
        runs-on: ubuntu-latest

        name: Code Style

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: 8.4
                  tools: composer:2.9.8
                  coverage: none

            - name: Install dependencies
              run: composer install --prefer-dist --no-interaction

            - name: Check code style
              run: vendor/bin/pint --test
